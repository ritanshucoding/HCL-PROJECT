<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Liver Disease Prediction</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input,
        select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            width: 100%;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #007bff;
        }

        .button-container {
            margin-top: 30px;
            text-align: center;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            background: #eef6ff;
            text-align: center;
        }

        .result h2 {
            color: #222;
            margin-bottom: 10px;
        }

        .result p {
            font-size: 18px;
            font-weight: bold;
            color: #007bff;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #007bff;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        @media (max-width: 700px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🩺 Liver Disease Prediction</h1>

    <p class="subtitle">
        Enter the required health parameters to get a predicted liver disease risk result.
    </p>

    <form action="/liver" method="POST">

        <div class="form-grid">

            <!-- Age -->
            <div class="form-group">
                <label for="age">Age</label>
                <input
                    type="number"
                    id="age"
                    name="age"
                    step="any"
                    required
                    placeholder="Enter age">
            </div>

            <!-- Gender -->
            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="0">Female</option>
                    <option value="1">Male</option>
                </select>
            </div>

            <!-- Total Bilirubin -->
            <div class="form-group">
                <label for="total_bilirubin">Total Bilirubin</label>
                <input
                    type="number"
                    id="total_bilirubin"
                    name="total_bilirubin"
                    step="any"
                    required
                    placeholder="Enter total bilirubin">
            </div>

            <!-- Direct Bilirubin -->
            <div class="form-group">
                <label for="direct_bilirubin">Direct Bilirubin</label>
                <input
                    type="number"
                    id="direct_bilirubin"
                    name="direct_bilirubin"
                    step="any"
                    required
                    placeholder="Enter direct bilirubin">
            </div>

            <!-- Alkaline Phosphotase -->
            <div class="form-group">
                <label for="alkaline_phosphotase">
                    Alkaline Phosphotase
                </label>
                <input
                    type="number"
                    id="alkaline_phosphotase"
                    name="alkaline_phosphotase"
                    step="any"
                    required
                    placeholder="Enter value">
            </div>

            <!-- Alamine Aminotransferase -->
            <div class="form-group">
                <label for="alamine_aminotransferase">
                    Alamine Aminotransferase
                </label>
                <input
                    type="number"
                    id="alamine_aminotransferase"
                    name="alamine_aminotransferase"
                    step="any"
                    required
                    placeholder="Enter value">
            </div>

            <!-- Aspartate Aminotransferase -->
            <div class="form-group">
                <label for="aspartate_aminotransferase">
                    Aspartate Aminotransferase
                </label>
                <input
                    type="number"
                    id="aspartate_aminotransferase"
                    name="aspartate_aminotransferase"
                    step="any"
                    required
                    placeholder="Enter value">
            </div>

            <!-- Total Proteins -->
            <div class="form-group">
                <label for="total_proteins">
                    Total Proteins
                </label>
                <input
                    type="number"
                    id="total_proteins"
                    name="total_proteins"
                    step="any"
                    required
                    placeholder="Enter total proteins">
            </div>

            <!-- Albumin -->
            <div class="form-group">
                <label for="albumin">Albumin</label>
                <input
                    type="number"
                    id="albumin"
                    name="albumin"
                    step="any"
                    required
                    placeholder="Enter albumin">
            </div>

            <!-- Albumin and Globulin Ratio -->
            <div class="form-group">
                <label for="albumin_and_globulin_ratio">
                    Albumin and Globulin Ratio
                </label>
                <input
                    type="number"
                    id="albumin_and_globulin_ratio"
                    name="albumin_and_globulin_ratio"
                    step="any"
                    required
                    placeholder="Enter ratio">
            </div>

        </div>

        <div class="button-container">
            <button type="submit">
                Predict Liver Disease Risk
            </button>
        </div>

    </form>

    {% if prediction %}
    <div class="result">
        <h2>Prediction Result</h2>
        <p>{{ prediction }}</p>
    </div>
    {% endif %}

    <a href="/" class="back">
        ← Back to Home
    </a>

</div>

</body>
</html>
