<!DOCTYPE html>
<html>
<head>
    <title>Diabetes Risk Prediction</title>
</head>
<body>
    <h1>Early Diabetes Risk Prediction</h1>
    <form method="POST">
        <label>Pregnancies:</label>
        <input type="number" name="Pregnancies" required>
        <br><br>
        <label>Glucose:</label>
        <input type="number" name="Glucose" required>
        <br><br>
        <label>Blood Pressure:</label>
        <input type="number" name="BloodPressure" required>
        <br><br>
        <label>Skin Thickness:</label>
        <input type="number" name="SkinThickness" required>
        <br><br>
        <label>Insulin:</label>
        <input type="number" name="Insulin" required>
        <br><br>
        <label>BMI:</label>
        <input type="number" step="0.1" name="BMI" required>
        <br><br>
        <label>Diabetes Pedigree Function:</label>
        <input type="number" step="0.01"
               name="DiabetesPedigreeFunction" required>
        <br><br>
        <label>Age:</label>
        <input type="number" name="Age" required>
        <br><br>
        <button type="submit">Predict</button>
    </form>
    {% if prediction is not none %}
        {% if prediction == 1 %}
            <h2>Predicted Risk: Higher</h2>
        {% else %}
            <h2>Predicted Risk: Lower</h2>
        {% endif %}

    {% endif %}

</body>
</html>
